<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse - Community Complaints</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
      color: #222;
      background: #f5f7fa;
    }

    h1 { color: #176b55; }

    .filters, .complaint {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
    }

    .complaint h2 { margin-top: 0; }
    .muted { color: #666; }

    select, button {
      padding: 10px;
      margin: 5px 4px 5px 0;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    button {
      background: #176b55;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    img {
      max-width: 260px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin: 10px 0;
    }

    .message { margin-top: 8px; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #176b55; }
  </style>
</head>

<body>
  <h1>Community Complaints</h1>
  <p class="muted">View complaints and update their current status.</p>

  <div class="filters">
    <label for="statusFilter"><strong>Filter complaints:</strong></label>

    <select id="statusFilter">
      <option value="all">All Complaints</option>
      <option value="pending">Pending</option>
      <option value="in-progress">In Progress</option>
      <option value="solved">Solved</option>
    </select>

    <button id="refreshButton" type="button">Refresh List</button>
  </div>

  <p id="summary" aria-live="polite">Loading complaints...</p>
  <div id="complaintList"></div>

  <script>
    const list = document.getElementById("complaintList");
    const filter = document.getElementById("statusFilter");
    const summary = document.getElementById("summary");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function statusValue(status) {
      const value = String(status || "Pending").toLowerCase();

      if (
        value === "in progress" ||
        value === "in-progress" ||
        value === "inprogress"
      ) {
        return "in-progress";
      }

      if (
        value === "solved" ||
        value === "resolved" ||
        value === "completed"
      ) {
        return "solved";
      }

      return "pending";
    }

    // Format the existing report timestamp for display.
    function formatReportedDate(value) {
      if (!value) return "Not available";

      // Handle Unix timestamps if the API returns one.
      let date;

      if (typeof value === "number") {
        date = new Date(value < 1e12 ? value * 1000 : value);
      } else {
        date = new Date(value);
      }

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    async function loadComplaints() {
      list.innerHTML = "";
      summary.textContent = "Loading complaints...";

      try {
        const response = await fetch("/api/issues");

        if (!response.ok) {
          throw new Error("Could not load complaints.");
        }

        const issues = await response.json();
        const selected = filter.value;

        const filtered = issues.filter(issue =>
          selected === "all" ||
          statusValue(issue.status) === selected
        );

        summary.textContent =
          `${filtered.length} complaint(s) shown out of ${issues.length}.`;

        if (!filtered.length) {
          list.textContent = "No complaints found for this filter.";
          return;
        }

        filtered.forEach(issue => {
          const card = document.createElement("section");
          card.className = "complaint";

          const id = Number(issue.id);

          if (!Number.isInteger(id) || id <= 0) return;

          const reportedAt = formatReportedDate(issue.reported_at);

          const photo = issue.photo
            ? `<img
                 src="/uploads/${encodeURIComponent(issue.photo)}"
                 alt="Complaint photo"
                 loading="lazy"
                 onerror="this.style.display='none'"
               >`
            : "";

          card.innerHTML = `
            <h2>${escapeHTML(
              issue.title || issue.category || "Community Issue"
            )}</h2>

            <p>
              <strong>Complaint ID:</strong>
              ${escapeHTML(
                issue.issue_id ||
                ("CP-" + String(id).padStart(4, "0"))
              )}
            </p>

            <p>
              <strong>Category:</strong>
              ${escapeHTML(issue.category || "Other")}
            </p>

            <p>
              <strong>Address:</strong>
              ${escapeHTML(issue.address || "Not provided")}
            </p>

            <p>
              <strong>Reported Date &amp; Time:</strong>
              ${reportedAt}
            </p>

            <p>
              <strong>Priority:</strong>
              ${escapeHTML(issue.priority ?? 0)}/100
            </p>

            <p>
              <strong>Current status:</strong>
              <span class="current-status">
                ${escapeHTML(issue.status || "Pending")}
              </span>
            </p>

            ${photo}

            <div>
              <label for="status-${id}">
                <strong>Update status:</strong>
              </label>
              <br>

              <select id="status-${id}" class="status-select">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="solved">Solved</option>
              </select>

              <button type="button" class="save-status">
                Save Status
              </button>

              <p class="message" aria-live="polite"></p>
            </div>
          `;

          const select = card.querySelector(".status-select");
          const saveButton = card.querySelector(".save-status");
          const message = card.querySelector(".message");

          select.value = statusValue(issue.status);

          saveButton.addEventListener("click", async () => {
            saveButton.disabled = true;
            message.className = "message";
            message.textContent = "Saving status...";

            try {
              const result = await fetch(
                `/api/issues/${id}/status`,
                {
                  method: "PATCH",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    status: select.value
                  })
                }
              );

              const data = await result.json();

              if (!result.ok || !data.success) {
                throw new Error(
                  data.error || "Status update failed."
                );
              }

              message.className = "message success";
              message.textContent = "Status updated successfully.";

              await loadComplaints();

            } catch (error) {
              message.className = "message error";
              message.textContent =
                error.message ||
                "Unable to update status. Please try again.";

            } finally {
              saveButton.disabled = false;
            }
          });

          list.appendChild(card);
        });

      } catch (error) {
        summary.textContent = "Unable to load complaints.";
        list.textContent = error.message;
      }
    }

    filter.addEventListener("change", loadComplaints);

    document.getElementById("refreshButton")
      .addEventListener("click", loadComplaints);

    loadComplaints();
  </script>
</body>
</html>
