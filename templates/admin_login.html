
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse | Admin Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f8f6;
            color: #18332e;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border: 1px solid #e0eae6;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }

        h1 { margin: 0 0 8px; color: #078568; }
        p { color: #647872; }
        label { display: block; margin-top: 18px; font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd8d2;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #078568;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error { color: #b42318; }
        .back { display: inline-block; margin-top: 18px; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>CivicPulse</h1>
        <p>Administrator login</p>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next', '')) }}">
            <label for="username">Username</label>
            <input id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <a class="back" href="{{ url_for('home') }}">← Back to Home</a>
    </main>
</body>
</html>
